<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Pulai PC Admin Dashboard</title>
    <!-- Supabase JS Client library -->
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <style>
        body { font-family: sans-serif; background: #121212; color: #fff; margin: 0; padding: 20px; }
        .admin-container { max-width: 1100px; margin: 0 auto; }
        #loginOverlay { position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: #121212; display: flex; justify-content: center; align-items: center; z-index: 9999; }
        .login-card { background: #1a1a1a; border: 1px solid #333; padding: 30px; border-radius: 8px; width: 320px; text-align: center; }
        .login-card input { width: 100%; padding: 10px; margin: 8px 0; box-sizing: border-box; background: #252525; border: 1px solid #444; color: #fff; border-radius: 4px; }
        .login-card button { width: 100%; padding: 10px; background: #00e676; border: none; color: #121212; font-weight: bold; border-radius: 4px; cursor: pointer; margin-top: 10px; }
        .header-bar { display: flex; justify-content: space-between; align-items: center; border-bottom: 1px solid #333; padding-bottom: 15px; margin-bottom: 20px; flex-wrap: wrap; gap: 15px; }
        h1 { color: #00e676; margin: 0; font-size: 24px; }
        .stats-overview { display: grid; grid-template-columns: repeat(auto-fit, minmax(180px, 1fr)); gap: 15px; margin-bottom: 20px; }
        .stat-card { background: #1a1a1a; border: 1px solid #333; border-radius: 8px; padding: 15px; text-align: center; }
        .stat-card .val { font-size: 22px; font-weight: bold; color: #00e676; margin-top: 5px; }
        .stat-card .lbl { font-size: 12px; color: #aaa; text-transform: uppercase; }
        .controls-row { display: flex; gap: 12px; margin-bottom: 20px; flex-wrap: wrap; }
        .search-box { flex: 1; min-width: 200px; padding: 10px; background: #1a1a1a; border: 1px solid #333; color: #fff; border-radius: 6px; }
        .filter-btn { background: #1a1a1a; color: #ccc; border: 1px solid #333; padding: 8px 14px; border-radius: 6px; cursor: pointer; }
        .filter-btn.active { background: #00e676; color: #121212; font-weight: bold; }
        .btn-action { background: #2196F3; color: white; border: none; padding: 8px 14px; border-radius: 6px; cursor: pointer; font-weight: bold; }
        .btn-logout { background: #ff5252; }
        .orders-grid { display: flex; flex-direction: column; gap: 15px; }
        .order-card { background: #1a1a1a; border: 1px solid #333; border-radius: 8px; padding: 16px; display: flex; flex-direction: column; gap: 12px; border-left: 4px solid #888; }
        .order-card.status-Pending { border-left-color: #ffb74d; }
        .order-card.status-In-Progress { border-left-color: #2196F3; }
        .order-card.status-Completed { border-left-color: #00e676; }
        .order-card.status-Cancelled { border-left-color: #ff5252; }
        .order-header { display: flex; justify-content: space-between; align-items: center; flex-wrap: wrap; }
        .customer-id { font-size: 18px; font-weight: bold; }
        .order-body { display: grid; grid-template-columns: 1fr 1fr; gap: 15px; background: #141414; padding: 12px; border-radius: 6px; }
        @media (max-width: 700px) { .order-body { grid-template-columns: 1fr; } }
        .status-select { padding: 8px; border-radius: 6px; background: #252525; color: #fff; border: 1px solid #444; cursor: pointer; }
        .delete-btn { background: transparent; color: #ff5252; border: 1px solid #ff5252; padding: 6px 12px; border-radius: 4px; cursor: pointer; }
        .no-orders { text-align: center; padding: 40px; color: #666; background: #1a1a1a; border-radius: 8px; }
    </style>
</head>
<body>

    <!-- AUTHENTICATION OVERLAY -->
    <div id="loginOverlay">
        <div class="login-card">
            <h2 style="color:#00e676; margin-top:0;">Admin Login</h2>
            <p style="font-size:13px; color:#aaa;">Enter your admin credentials</p>
            <input type="email" id="adminEmail" placeholder="Email">
            <input type="password" id="adminPassword" placeholder="Password">
            <button onclick="login()">Log In</button>
        </div>
    </div>

    <!-- MAIN DASHBOARD CONTENT -->
    <div class="admin-container" id="adminDashboard" style="display:none;">
        <div class="header-bar">
            <h1>⚙️ Admin Dashboard</h1>
            <div>
                <button class="btn-action" onclick="loadOrders()">🔄 Refresh</button>
                <button class="btn-action btn-logout" onclick="logout()">Logout</button>
            </div>
        </div>

        <!-- STATS CARDS -->
        <div class="stats-overview">
            <div class="stat-card"><div class="lbl">Total Orders</div><div class="val" id="statTotal">0</div></div>
            <div class="stat-card"><div class="lbl">Pending</div><div class="val" id="statPending" style="color:#ffb74d;">0</div></div>
            <div class="stat-card"><div class="lbl">In Progress</div><div class="val" id="statInProgress" style="color:#2196F3;">0</div></div>
            <div class="stat-card"><div class="lbl">Est. Revenue</div><div class="val" id="statRevenue">RM0</div></div>
        </div>

        <!-- FILTERS AND SEARCH -->
        <div class="controls-row">
            <input type="text" id="adminSearchInput" class="search-box" placeholder="🔍 Search phone or game..." onkeyup="filterAndRenderOrders()">
            <div style="display:flex; gap:6px; flex-wrap:wrap;">
                <button class="filter-btn active" data-status="ALL" onclick="setStatusFilter('ALL', this)">All</button>
                <button class="filter-btn" data-status="Pending" onclick="setStatusFilter('Pending', this)">Pending</button>
                <button class="filter-btn" data-status="In Progress" onclick="setStatusFilter('In Progress', this)">In Progress</button>
                <button class="filter-btn" data-status="Completed" onclick="setStatusFilter('Completed', this)">Completed</button>
                <button class="filter-btn" data-status="Cancelled" onclick="setStatusFilter('Cancelled', this)">Cancelled</button>
            </div>
        </div>

        <!-- ORDER LIST CONTAINER -->
        <div id="ordersContainer" class="orders-grid"></div>
    </div>

    <script src="config.js"></script>
    <script>
        // 1. Initialize Supabase Connection
        const supabaseClient = supabase.createClient(APP_CONFIG.supabaseUrl, APP_CONFIG.supabaseAnonKey);
        
        // Local State Variables
        let allOrders = [];
        let currentStatusFilter = 'ALL';

        // 2. Authentication Check on Page Load
        window.onload = async function() {
            const { data: { session } } = await supabaseClient.auth.getSession();
            if (session) {
                document.getElementById('loginOverlay').style.display = 'none';
                document.getElementById('adminDashboard').style.display = 'block';
                loadOrders();
            }
        };

        // 3. User Login Action
        async function login() {
            const email = document.getElementById('adminEmail').value;
            const password = document.getElementById('adminPassword').value;

            const { error } = await supabaseClient.auth.signInWithPassword({ email, password });
            if (error) {
                alert('Login failed: ' + error.message);
            } else {
                location.reload();
            }
        }

        // 4. User Logout Action
        async function logout() {
            await supabaseClient.auth.signOut();
            location.reload();
        }

        // 5. Fetch Orders from Database
        async function loadOrders() {
            const container = document.getElementById('ordersContainer');
            container.innerHTML = '<div class="no-orders">Loading orders...</div>';

            try {
                const { data, error } = await supabaseClient
                    .from('orders')
                    .select('*')
                    .order('created_at', { ascending: false });

                if (error) throw error;
                allOrders = data || [];
                updateStats();
                filterAndRenderOrders();
            } catch (err) {
                alert('Error loading orders: ' + err.message);
            }
        }

        // 6. Calculate Top Dashboard Metrics
        function updateStats() {
            document.getElementById('statTotal').innerText = allOrders.length;
            document.getElementById('statPending').innerText = allOrders.filter(o => (o.status || 'Pending') === 'Pending').length;
            document.getElementById('statInProgress').innerText = allOrders.filter(o => o.status === 'In Progress').length;
            
            const totalRev = allOrders
                .filter(o => o.status !== 'Cancelled')
                .reduce((sum, o) => sum + (Number(o.estimated_price) || 0), 0);
            document.getElementById('statRevenue').innerText = `RM${Math.round(totalRev)}`;
        }

        // 7. Filter Buttons Controller
        function setStatusFilter(status, btn) {
            currentStatusFilter = status;
            document.querySelectorAll('.filter-btn').forEach(b => b.classList.remove('active'));
            btn.classList.add('active');
            filterAndRenderOrders();
        }

        // 8. Filter and Render DOM Nodes
        function filterAndRenderOrders() {
            const query = document.getElementById('adminSearchInput').value.toLowerCase().trim();
            const container = document.getElementById('ordersContainer');

            let filtered = allOrders.filter(order => {
                const orderStatus = order.status || 'Pending';
                if (currentStatusFilter !== 'ALL' && orderStatus !== currentStatusFilter) return false;
                if (query) {
                    const phoneMatch = order.phone_ending && order.phone_ending.toLowerCase().includes(query);
                    const gameMatch = order.games && order.games.some(g => g.toLowerCase().includes(query));
                    return phoneMatch || gameMatch;
                }
                return true;
            });

            if (filtered.length === 0) {
                container.innerHTML = '<div class="no-orders">No matching orders found.</div>';
                return;
            }

            container.innerHTML = '';
            filtered.forEach(order => {
                const card = document.createElement('div');
                const statusClass = (order.status || 'Pending').replace(' ', '-');
                card.className = `order-card status-${statusClass}`;

                const gamesList = (order.games && order.games.length > 0) 
                    ? order.games.map((g, i) => `<div>${i + 1}. ${g}</div>`).join('')
                    : '<em>No games selected</em>';

                card.innerHTML = `
                    <div class="order-header">
                        <div class="customer-id">📱 Phone ID: ${order.phone_ending}</div>
                        <div style="font-size:12px; color:#888;">${new Date(order.created_at).toLocaleString()}</div>
                    </div>
                    <div class="order-body">
                        <div>
                            <strong>Service:</strong> ${order.service_type || 'N/A'}<br>
                            <strong>Storage:</strong> ${order.sd_card_size || order.free_storage_gb || 0} GB<br>
                            <strong>Remarks:</strong> ${order.remarks || 'None'}
                        </div>
                        <div>
                            <strong>Games (${order.total_games || 0}):</strong>
                            <div style="max-height:80px; overflow-y:auto; font-size:12px;">${gamesList}</div>
                        </div>
                    </div>
                    <div style="display:flex; justify-content:space-between; align-items:center;">
                        <div>
                            <span style="font-size:12px; color:#aaa;">Status: </span>
                            <select class="status-select" onchange="updateStatus('${order.id}', this.value)">
                                <option value="Pending" ${order.status === 'Pending' || !order.status ? 'selected' : ''}>⏳ Pending</option>
                                <option value="In Progress" ${order.status === 'In Progress' ? 'selected' : ''}>🔧 In Progress</option>
                                <option value="Completed" ${order.status === 'Completed' ? 'selected' : ''}>✅ Completed</option>
                                <option value="Cancelled" ${order.status === 'Cancelled' ? 'selected' : ''}>❌ Cancelled</option>
                            </select>
                        </div>
                        <div>
                            <strong style="color:#00e676; margin-right:10px;">RM${Math.round(order.estimated_price || 0)}</strong>
                            <button class="delete-btn" onclick="deleteOrder('${order.id}')">Delete</button>
                        </div>
                    </div>
                `;
                container.appendChild(card);
            });
        }

        // 9. Update Order Status in Database
        async function updateStatus(orderId, newStatus) {
            const { error } = await supabaseClient.from('orders').update({ status: newStatus }).eq('id', orderId);
            if (error) alert('Failed to update status: ' + error.message);
            else {
                const o = allOrders.find(item => item.id === orderId);
                if (o) o.status = newStatus;
                updateStats();
                filterAndRenderOrders();
            }
        }

        // 10. Delete Order from Database
        async function deleteOrder(orderId) {
            if (!confirm('Are you sure you want to delete this order?')) return;
            const { error } = await supabaseClient.from('orders').delete().eq('id', orderId);
            if (error) alert('Delete failed: ' + error.message);
            else {
                allOrders = allOrders.filter(o => o.id !== orderId);
                updateStats();
                filterAndRenderOrders();
            }
        }
    </script>
</body>
</html>
