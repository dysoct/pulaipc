    let selectedGames = new Map(); // Stores game name -> size mapping

    window.onload = function() {
        const savedPhone = localStorage.getItem('userPhone4');
        if (savedPhone) {
            document.getElementById('phoneInput').value = savedPhone;
        }
        renderGames(games);
    };

    function savePhone() {
        const phone = document.getElementById('phoneInput').value;
        localStorage.setItem('userPhone4', phone);
    }

    function renderGames(list) {
        const container = document.getElementById('gameList');
        container.innerHTML = '';

        if (list.length === 0) {
            container.innerHTML = '<p style="text-align:center; color:#888;">No games found.</p>';
            return;
        }

        list.forEach(game => {
            const isSelected = selectedGames.has(game.name);
            const card = document.createElement('div');
            card.className = `game-card ${isSelected ? 'selected' : ''}`;
            card.onclick = (e) => {
                if (e.target.tagName !== 'INPUT') {
                    const cb = card.querySelector('input');
                    cb.checked = !cb.checked;
                    toggleGame(game.name, game.size, cb.checked);
                }
            };

            card.innerHTML = `
                <div class="game-info">
                    <input type="checkbox" ${isSelected ? 'checked' : ''} onchange="toggleGame('${game.name.replace(/'/g, "\\'")}', ${game.size}, this.checked)">
                    <span class="game-title">${game.name}</span>
                </div>
                <span class="game-size">${game.size} GB</span>
            `;
            container.appendChild(card);
        });
        updateCartSummary();
    }

    function toggleGame(name, size, isChecked) {
        if (isChecked) {
            selectedGames.set(name, size);
        } else {
            selectedGames.delete(name);
        }
        renderGames(games);
    }

    // ==========================================
    // 2. DUAL-METRIC PRICING (Count vs Size)
    // ==========================================
    function calculatePrice(count, totalSizeGb) {
        if (count <= 0) return 0;

        // Determine equivalent tier level for game count
        let countTierPrice = 0;
        if (count <= 10) {
            countTierPrice = count * 3.0;
        } else if (count <= 20) {
            countTierPrice = 30 + (count - 10) * 2.5; // RM2.50 per game for 20 pack
        } else if (count <= 40) {
            countTierPrice = 50 + (count - 20) * 1.5; 
        } else {
            countTierPrice = 80 + (count - 40) * 2.0;
        }

        // Determine equivalent tier level for GB size (100GB=30, 200GB=50, 400GB=80)
        let sizeTierPrice = 0;
        if (totalSizeGb <= 100) {
            sizeTierPrice = (totalSizeGb / 100) * 30;
        } else if (totalSizeGb <= 200) {
            sizeTierPrice = 30 + ((totalSizeGb - 100) / 100) * 20; // 100GB to 200GB costs +RM20
        } else if (totalSizeGb <= 400) {
            sizeTierPrice = 50 + ((totalSizeGb - 200) / 200) * 30; // 200GB to 400GB costs +RM30
        } else {
            sizeTierPrice = 80 + ((totalSizeGb - 400) / 100) * 20;
        }

        // Return whichever metric hits the higher tier first (whichever comes first/higher)
        return Math.max(countTierPrice, sizeTierPrice);
    }

    function updateCartSummary() {
        const count = selectedGames.size;
        let totalSize = 0;
        selectedGames.forEach(size => {
            totalSize += size;
        });

        const price = calculatePrice(count, totalSize);

        document.getElementById('selectedCount').innerText = count;
        document.getElementById('selectedSize').innerText = totalSize.toFixed(1);
        document.getElementById('selectedPrice').innerText = `RM${Math.round(price)}`;
    }

    function filterGames() {
        const query = document.getElementById('searchInput').value.toLowerCase();
        const filtered = games.filter(g => g.name.toLowerCase().includes(query));
        renderGames(filtered);
    }

    // ==========================================
    // 3. FETCH / RECALL EXISTING ORDER
    // ==========================================
    async function fetchExistingOrder() {
        const phone = document.getElementById('phoneInput').value.trim();
        const statusMsg = document.getElementById('statusMsg');

        if (phone.length !== 4) {
            alert('Please enter the exact last 4 digits of your phone number!');
            document.getElementById('phoneInput').focus();
            return;
        }

        statusMsg.style.color = '#2196F3';
        statusMsg.innerText = 'Searching for your order...';

        try {
            const { data, error } = await supabaseClient
                .from('orders')
                .select('*')
                .eq('phone_ending', phone)
                .order('created_at', { ascending: false })
                .limit(1);

            if (error) throw error;

            if (data && data.length > 0) {
                selectedGames.clear();
                data[0].games.forEach(gameName => {
                    const found = games.find(g => g.name === gameName);
                    const size = found ? found.size : 0;
                    selectedGames.set(gameName, size);
                });
                
                // Load remarks if saved
                if (data[0].remarks) {
                    document.getElementById('orderRemarks').value = data[0].remarks;
                }

                renderGames(games);
                statusMsg.style.color = '#00e676';
                statusMsg.innerText = `Loaded previous order! (${selectedGames.size} games found)`;
            } else {
                statusMsg.style.color = '#ff5252';
                statusMsg.innerText = 'No existing order found for this 4-digit ID.';
            }
        } catch (err) {
            console.error(err);
            statusMsg.style.color = '#ff5252';
            statusMsg.innerText = 'Failed to lookup order.';
        }
    }

    // ==========================================
    // 4. CART MODAL CONTROLS
    // ==========================================
    function openCartModal() {
        if (selectedGames.size === 0) {
            alert('Please select at least one game first!');
            return;
        }

        const modalBody = document.getElementById('cartModalBody');
        modalBody.innerHTML = '';

        selectedGames.forEach((size, gameName) => {
            const item = document.createElement('div');
            item.className = 'cart-item';
            item.innerHTML = `
                <span>${gameName} <span style="color:#00e676; font-size:0.85em;">(${size} GB)</span></span>
                <button class="remove-btn" onclick="removeGameFromCart('${gameName.replace(/'/g, "\\'")}')">Remove</button>
            `;
            modalBody.appendChild(item);
        });

        const count = selectedGames.size;
        let totalSize = 0;
        selectedGames.forEach(size => { totalSize += size; });
        const price = Math.round(calculatePrice(count, totalSize));
        
        document.getElementById('modalTotal').innerText = `${count} games (${totalSize.toFixed(1)} GB) | Total: RM${price}`;
        document.getElementById('cartModal').style.display = 'flex';
    }

    function closeCartModal() {
        document.getElementById('cartModal').style.display = 'none';
    }

    function removeGameFromCart(gameName) {
        selectedGames.delete(gameName);
        renderGames(games);
        
        if (selectedGames.size === 0) {
            closeCartModal();
        } else {
            openCartModal();
        }
    }

    // ==========================================
    // 5. UPSERT (UPDATE OR INSERT) ORDER
    // ==========================================
    async function submitOrUpdateOrder() {
        const phone = document.getElementById('phoneInput').value.trim();
        if (phone.length !== 4) {
            alert('Please enter your 4-digit phone ID at the top!');
            document.getElementById('phoneInput').focus();
            return;
        }

        if (selectedGames.size === 0) {
            alert('Your selection is empty!');
            return;
        }

        const btn = document.querySelector('#cartModal .submit-btn');
        btn.innerText = 'Saving...';
        btn.disabled = true;

        const gameNamesArray = Array.from(selectedGames.keys());
        const remarksText = document.getElementById('orderRemarks').value.trim();

        try {
            const { data: existing } = await supabaseClient
                .from('orders')
                .select('id')
                .eq('phone_ending', phone);

            let error;

            if (existing && existing.length > 0) {
                const { error: updateError } = await supabaseClient
                    .from('orders')
                    .update({ 
                        games: gameNamesArray,
                        total_games: selectedGames.size,
                        remarks: remarksText,
                        created_at: new Date()
                    })
                    .eq('phone_ending', phone);
                error = updateError;
            } else {
                const { error: insertError } = await supabaseClient
                    .from('orders')
                    .insert([
                        { 
                            phone_ending: phone, 
                            games: gameNamesArray,
                            total_games: selectedGames.size,
                            remarks: remarksText
                        }
                    ]);
                error = insertError;
            }

            if (error) throw error;

            alert('Order updated and saved successfully!');
            closeCartModal();
            document.getElementById('statusMsg').innerText = 'Order successfully updated in system!';

        } catch (err) {
            console.error(err);
            alert('Failed to save order. Check console for details.');
        } finally {
            btn.innerText = 'Save Changes';
            btn.disabled = false;
        }
    }
